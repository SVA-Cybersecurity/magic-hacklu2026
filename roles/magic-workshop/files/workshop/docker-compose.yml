x-timesketch-dependencies: &timesketch-dependencies
  depends_on:
    opensearch:
      condition: service_healthy
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

networks:
  workshop:
    name: ${DOCKER_NETWORK_NAME}

volumes:
  jupyterhub-data:

services:
  nginx:
    container_name: workshop-nginx
    image: nginx:${NGINX_VERSION}
    restart: always
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/auth.conf:/etc/nginx/auth.conf:ro
      - ./config/nginx/htpasswd:/etc/nginx/htpasswd:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - workshop
    depends_on:
      - timesketch-web
      - jupyterhub

  jupyterhub:
    container_name: workshop-jupyterhub
    build:
      context: ./images/jupyterhub
      args:
        JUPYTERHUB_VERSION: ${JUPYTERHUB_VERSION}
    restart: always
    environment:
      - DOCKER_NETWORK_NAME=${DOCKER_NETWORK_NAME}
      - SINGLEUSER_IMAGE=${SINGLEUSER_IMAGE}
      - SINGLEUSER_MEM_LIMIT=${SINGLEUSER_MEM_LIMIT}
      - SINGLEUSER_CPU_LIMIT=${SINGLEUSER_CPU_LIMIT}
      - JUPYTERHUB_ADMIN_USERS=${JUPYTERHUB_ADMIN_USERS}
      - PARTICIPANT_DATA_HOST_PATH=${WORKSHOP_ROOT}/${PARTICIPANT_DATA_DIR}
      - SHARED_DATA_HOST_PATH=${WORKSHOP_ROOT}/${SHARED_DATA_DIR:-shared-data}
      - MAGIC_CLIENT_ID=${MAGIC_CLIENT_ID}
      - MAGIC_CLIENT_SECRET=${MAGIC_CLIENT_SECRET}
      - MAGIC_TENANT_ID=${MAGIC_TENANT_ID}
      - TIMESKETCH_HOST_URI=http://timesketch-web:5000
      - PUBLIC_HOSTNAME=${PUBLIC_HOSTNAME}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/jupyterhub:/srv/jupyterhub/config:ro
      - ./provisioning:/srv/provisioning:ro
      - jupyterhub-data:/srv/jupyterhub/data
      # Mounted at the host path so DockerSpawner volume templating and the
      # pre-spawn existence check both resolve to the same location.
      - ${WORKSHOP_ROOT}/${PARTICIPANT_DATA_DIR}:${WORKSHOP_ROOT}/${PARTICIPANT_DATA_DIR}
    networks:
      - workshop

  timesketch-web:
    container_name: timesketch-web
    image: us-docker.pkg.dev/osdfir-registry/timesketch/timesketch:${TIMESKETCH_VERSION}
    restart: always
    command: timesketch-web
    environment:
      - NUM_WSGI_WORKERS=${NUM_WSGI_WORKERS}
      - WSGI_WORKER_CLASS=${WSGI_WORKER_CLASS}
      - NUM_WSGI_THREADS=${NUM_WSGI_THREADS}
    volumes:
      - ${TIMESKETCH_CONFIG_PATH}:/etc/timesketch/
      - ${TIMESKETCH_UPLOAD_PATH}:/usr/share/timesketch/upload/
      - ${TIMESKETCH_LOGS_PATH}:/var/log/timesketch/
    networks:
      - workshop
    <<: *timesketch-dependencies

  timesketch-worker:
    container_name: timesketch-worker
    image: us-docker.pkg.dev/osdfir-registry/timesketch/timesketch:${TIMESKETCH_VERSION}
    restart: always
    command: timesketch-worker
    environment:
      - WORKER_LOG_LEVEL=${WORKER_LOG_LEVEL}
    volumes:
      - ${TIMESKETCH_CONFIG_PATH}:/etc/timesketch/
      - ${TIMESKETCH_UPLOAD_PATH}:/usr/share/timesketch/upload/
      - ${TIMESKETCH_LOGS_PATH}:/var/log/timesketch/
    networks:
      - workshop
    <<: *timesketch-dependencies

  opensearch:
    container_name: opensearch
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
    restart: always
    environment:
      - TAKE_FILE_OWNERSHIP=1
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_MEM_USE_GB}g -Xmx${OPENSEARCH_MEM_USE_GB}g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${OPENSEARCH_DATA_PATH}:/usr/share/opensearch/data/
    networks:
      - workshop
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=50s"]
      interval: 10s
      timeout: 10s
      retries: 5

  postgres:
    container_name: postgres
    image: postgres:${POSTGRES_VERSION}
    restart: always
    environment:
      - POSTGRES_USER=timesketch
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
    networks:
      - workshop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesketch -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: redis
    image: redis:${REDIS_VERSION}
    restart: always
    command: "redis-server"
    networks:
      - workshop
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
